<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk Developer - AppNesia</title>
<style>
:root{--bg:#1a0808;--surface:#2a0f0f;--line:#4a1c1c;--text:#f5eaea;--muted:#b9a0a0;--accent:#ff5a4d;--amber:#f5a623;--ok:#7bd88f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body{padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:480px;margin:0 auto}
header{position:fixed;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0);z-index:10}
.in{max-width:640px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text);text-decoration:none}
.brand img{width:34px;height:34px;border-radius:9px}
.wrap{width:100%;margin-top:60px}
h1{font-size:24px;margin:8px 0 4px;color:var(--accent);text-align:center}
.sub{color:var(--muted);font-size:14px;text-align:center;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--amber);outline-offset:2px}
button{width:100%;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#1a0808;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px}
button:disabled{opacity:.6;cursor:not-allowed}
button.alt{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:8px}
.msg{padding:10px 14px;border-radius:10px;margin:12px 0 0;font-size:14px;display:none}
.msg.ok{background:#1e3a26;color:var(--ok);display:block}
.msg.err{background:#3a1e1e;color:#ff9a90;display:block}
.switch{text-align:center;margin-top:16px;font-size:14px;color:var(--muted)}
.switch a{color:var(--amber);cursor:pointer;text-decoration:underline;font-weight:600}
.dash{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.dash b{color:var(--amber)}
.dash a.btn{display:inline-block;background:var(--accent);color:#1a0808;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:700;margin-top:12px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>

<div class="wrap">

<div id="formBox">
<h1 id="judul">Masuk Developer</h1>
<p class="sub" id="subjudul">Masuk untuk mengirim aplikasi ke AppNesia</p>

<div class="card">
<label for="email">Email</label>
<input type="email" id="email" placeholder="nama@email.com" autocomplete="email">

<label for="pass">Kata sandi</label>
<input type="password" id="pass" placeholder="Minimal 6 karakter" autocomplete="current-password">

<button id="submit">Masuk</button>

<div class="msg" id="msg"></div>

<div class="switch">
<span id="switchText">Belum punya akun?</span>
<a id="switchBtn">Daftar</a>
</div>
</div>

<p class="foot">Dengan masuk, kamu setuju dengan aturan AppNesia.</p>
</div>

<div id="dashBox" class="dash" style="display:none;margin-top:60px">
<h1 style="color:var(--ok)">✓ Sudah Masuk</h1>
<p>Halo, <b id="userEmail"></b>!</p>
<p style="color:var(--muted);font-size:14px">Kamu sudah login sebagai developer AppNesia.</p>
<a class="btn" href="https://developer.html">Kirim Aplikasi →</a>
<button class="alt" id="logout">Keluar</button>
</div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

// ============================================================
// KONFIGURASI SUPABASE
// ============================================================
const SUPABASE_URL = 'https://ddnqfpeszktuvsypseyc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkbnFmcGVzemt0dXZzeXBzZXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDMxNzgsImV4cCI6MjEwNjk3OTE3OH0.Lg2HCI2qCC4UEP_sN0IipIECKW49QCoHO48R5qVcTt0';
// ============================================================

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let mode = 'login';

function showMsg(text, ok){
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}
function clearMsg(){ $('msg').className = 'msg'; }

$('switchBtn').addEventListener('click', () => {
  mode = mode === 'login' ? 'daftar' : 'login';
  $('judul').textContent = mode === 'login' ? 'Masuk Developer' : 'Daftar Developer';
  $('subjudul').textContent = mode === 'login' ? 'Masuk untuk mengirim aplikasi ke AppNesia' : 'Buat akun baru untuk mengirim aplikasi';
  $('submit').textContent = mode === 'login' ? 'Masuk' : 'Daftar';
  $('switchText').textContent = mode === 'login' ? 'Belum punya akun?' : 'Sudah punya akun?';
  $('switchBtn').textContent = mode === 'login' ? 'Daftar' : 'Masuk';
  clearMsg();
});

$('submit').addEventListener('click', async () => {
  const email = $('email').value.trim();
  const pass = $('pass').value;
  clearMsg();

  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showMsg('Masukkan email yang valid.', false); return;
  }
  if(pass.length < 6){
    showMsg('Kata sandi minimal 6 karakter.', false); return;
  }

  $('submit').disabled = true;
  $('submit').textContent = mode === 'login' ? 'Memproses...' : 'Mendaftar...';

  try {
    if(mode === 'login'){
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if(error) throw error;
      showMsg('Berhasil masuk!', true);
      setTimeout(tampilkanDash, 600);
    } else {
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if(error) throw error;
      if(data.user && !data.session){
        showMsg('Berhasil daftar! Cek email kamu untuk verifikasi, lalu kembali ke halaman ini.', true);
      } else {
        showMsg('Berhasil daftar dan otomatis masuk!', true);
        setTimeout(tampilkanDash, 600);
      }
    }
  } catch(e){
    let pesan = e.message || 'Terjadi kesalahan.';
    if(pesan.includes('Invalid login credentials')) pesan = 'Email atau kata sandi salah.';
    if(pesan.includes('already registered')) pesan = 'Email ini sudah terdaftar. Coba masuk.';
    if(pesan.includes('Password should be')) pesan = 'Kata sandi minimal 6 karakter.';
    showMsg(pesan, false);
  }

  $('submit').disabled = false;
  $('submit').textContent = mode === 'login' ? 'Masuk' : 'Daftar';
});

$('logout').addEventListener('click', async () => {
  await sb.auth.signOut();
  localStorage.removeItem('an_email');
  location.reload();
});

async function tampilkanDash(){
  const { data } = await sb.auth.getUser();
  if(data && data.user){
    $('userEmail').textContent = data.user.email;
    localStorage.setItem('an_email', data.user.email);
    $('formBox').style.display = 'none';
    $('dashBox').style.display = 'block';
  } else {
    $('formBox').style.display = 'block';
    $('dashBox').style.display = 'none';
  }
}
tampilkanDash();

sb.auth.onAuthStateChange((_event, session) => {
  if(session && session.user){
    $('userEmail').textContent = session.user.email;
    localStorage.setItem('an_email', session.user.email);
    $('formBox').style.display = 'none';
    $('dashBox').style.display = 'block';
  } else {
    $('formBox').style.display = 'block';
    $('dashBox').style.display = 'none';
  }
});
</script>
