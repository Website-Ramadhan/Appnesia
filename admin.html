<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Appnesia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            padding: 20px; 
            color: #333;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #1a1a2e; }
        .subtitle { text-align: center; margin-bottom: 30px; color: #666; font-size: 14px; }
        
        .stats { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-box { 
            flex: 1; background: white; padding: 15px; border-radius: 10px; 
            text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); min-width: 120px;
        }
        .stat-box h3 { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .stat-box p { font-size: 24px; font-weight: bold; color: #1a1a2e; }

        .card { 
            background: white; padding: 20px; margin-bottom: 15px; 
            border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #ddd;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .card.lunas { border-left-color: #28a745; }
        .card.pending { border-left-color: #ffc107; }
        .card.menunggu { border-left-color: #007bff; }
        .card.gagal { border-left-color: #dc3545; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .order-id { font-size: 12px; color: #888; font-family: monospace; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-lunas { background: #d4edda; color: #155724; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-menunggu { background: #cce5ff; color: #004085; }
        .status-gagal { background: #f8d7da; color: #721c24; }

        .card-body p { margin-bottom: 5px; font-size: 14px; }
        .card-body strong { color: #555; }
        .harga { font-size: 18px; font-weight: bold; color: #1a1a2e; margin-top: 5px; }

        .actions { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { 
            padding: 8px 16px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: 600; font-size: 13px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-lunas { background: #28a745; color: white; }
        .btn-gagal { background: #dc3545; color: white; }
        .btn-hapus { background: #6c757d; color: white; margin-left: auto; }
        .btn-hapus:hover { background: #495057; }
        .btn-refresh { 
            background: #007bff; color: white; padding: 10px 20px; 
            display: block; margin: 0 auto 20px; font-size: 14px;
        }

        .loading { text-align: center; padding: 40px; color: #888; }
        .empty { text-align: center; padding: 40px; color: #888; font-style: italic; }
        
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 12px 24px; border-radius: 8px;
            font-size: 14px; z-index: 1000; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; max-width: 90%; text-align: center;
        }
        .toast.show { opacity: 1; }
        .toast.error { background: #dc3545; }
        .toast.success { background: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Dashboard Admin Appnesia</h1>
        <p class="subtitle">Kelola status pesanan</p>

        <button class="btn-refresh" onclick="ambilPesanan()">🔄 Refresh Data</button>

        <div class="stats" id="stats">
            <div class="stat-box"><h3>Total</h3><p id="stat-total">-</p></div>
            <div class="stat-box"><h3>Lunas</h3><p id="stat-lunas" style="color:#28a745">-</p></div>
            <div class="stat-box"><h3>Pending</h3><p id="stat-pending" style="color:#ffc107">-</p></div>
            <div class="stat-box"><h3>Gagal</h3><p id="stat-gagal" style="color:#dc3545">-</p></div>
        </div>

        <div id="daftar-pesanan">
            <div class="loading">⏳ Memuat data pesanan...</div>
        </div>
    </div>

    <div class="toast" id="toast">Pesan</div>

    <script>
        // ==========================================
        // KONFIGURASI: URL WORKER CLOUDFLARE ANDA
        // ==========================================
        const API_URL = 'https://appnesia.najwaawa2211.workers.dev';

        // ==========================================
        // FUNGSI UTAMA
        // ==========================================
        async function ambilPesanan() {
            const container = document.getElementById('daftar-pesanan');
            container.innerHTML = '<div class="loading">⏳ Memuat data pesanan...</div>';

            try {
                const response = await fetch(`${API_URL}/api/pesanan`);
                if (!response.ok) throw new Error('Gagal mengambil data');
                
                const data = await response.json();
                renderPesanan(data);
                hitungStats(data);
            } catch (error) {
                container.innerHTML = `<div class="empty">❌ Gagal memuat: ${escapeHtml(error.message)}</div>`;
            }
        }

        function renderPesanan(data) {
            const container = document.getElementById('daftar-pesanan');
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty">📭 Belum ada pesanan.</div>';
                return;
            }

            container.innerHTML = '';
            data.forEach(pesanan => {
                const status = (pesanan.status || 'pending').toLowerCase();
                const card = document.createElement('div');
                card.className = `card ${status}`;
                
                // Escape data user biar aman
                const orderIdEsc = escapeHtml(pesanan.order_id);
                const produkEsc = escapeHtml(pesanan.produk_nama || pesanan.produk || '-');

                card.innerHTML = `
                    <div class="card-header">
                        <span class="order-id">#${orderIdEsc}</span>
                        <span class="status-badge status-${status}">${escapeHtml(status)}</span>
                    </div>
                    <div class="card-body">
                        <p><strong>Produk:</strong> ${produkEsc}</p>
                        <p><strong>Harga:</strong> <span class="harga">Rp ${Number(pesanan.harga || 0).toLocaleString('id-ID')}</span></p>
                        <p style="font-size:12px; color:#999; margin-top:5px;">
                            Dibuat: ${pesanan.created_at ? new Date(pesanan.created_at).toLocaleString('id-ID') : '-'}
                        </p>
                    </div>
                    <div class="actions">
                        ${status !== 'lunas' ? `<button class="btn-lunas" onclick="ubahStatus('${orderIdEsc}', 'lunas', this)">✅ Ubah Jadi Lunas</button>` : ''}
                        ${status !== 'gagal' ? `<button class="btn-gagal" onclick="ubahStatus('${orderIdEsc}', 'gagal', this)">❌ Tandai Gagal</button>` : ''}
                        <button class="btn-hapus" onclick="hapusPesanan('${orderIdEsc}', this)">🗑️ Hapus</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function ubahStatus(orderId, statusBaru, btnEl) {
            const konfirmasi = confirm(`Yakin ingin mengubah pesanan #${orderId} menjadi "${statusBaru.toUpperCase()}"?`);
            if (!konfirmasi) return;

            if (btnEl) btnEl.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/pesanan/${encodeURIComponent(orderId)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: statusBaru })
                });

                const result = await response.json();

                if (response.ok) {
                    tampilkanToast(`✅ Pesanan #${orderId} berhasil diubah menjadi ${statusBaru}!`, 'success');
                    ambilPesanan(); // Refresh otomatis
                } else {
                    tampilkanToast(`❌ Gagal: ${result.error || 'Unknown error'}`, 'error');
                    if (btnEl) btnEl.disabled = false;
                }
            } catch (error) {
                tampilkanToast(`❌ Error: ${error.message}`, 'error');
                if (btnEl) btnEl.disabled = false;
            }
        }

        // ==========================================
        // FITUR BARU: HAPUS PESANAN
        // ==========================================
        async function hapusPesanan(orderId, btnEl) {
            const konfirmasi = confirm(
                `⚠️ Yakin ingin MENGHAPUS pesanan #${orderId}?\n\nTindakan ini tidak bisa dibatalkan!`
            );
            if (!konfirmasi) return;

            // Konfirmasi kedua untuk safety
            const konfirmasi2 = confirm(`Konfirmasi terakhir: Hapus permanen pesanan #${orderId}?`);
            if (!konfirmasi2) return;

            if (btnEl) {
                btnEl.disabled = true;
                btnEl.textContent = '⏳ Menghapus...';
            }

            try {
                const response = await fetch(`${API_URL}/api/pesanan/${encodeURIComponent(orderId)}`, {
                    method: 'DELETE'
                });

                let result = {};
                try { result = await response.json(); } catch (e) {}

                if (response.ok) {
                    tampilkanToast(`🗑️ Pesanan #${orderId} berhasil dihapus!`, 'success');

                    // Hapus card dari DOM dengan animasi (biar cepat, tanpa nunggu refresh)
                    if (btnEl) {
                        const card = btnEl.closest('.card');
                        if (card) {
                            card.style.transition = 'opacity 0.3s, transform 0.3s';
                            card.style.opacity = '0';
                            card.style.transform = 'translateX(-20px)';
                            setTimeout(() => card.remove(), 300);
                        }
                    }

                    // Refresh data setelah animasi
                    setTimeout(ambilPesanan, 400);
                } else {
                    tampilkanToast(`❌ Gagal hapus: ${result.error || 'Unknown error'}`, 'error');
                    if (btnEl) {
                        btnEl.disabled = false;
                        btnEl.textContent = '🗑️ Hapus';
                    }
                }
            } catch (error) {
                tampilkanToast(`❌ Error: ${error.message}`, 'error');
                if (btnEl) {
                    btnEl.disabled = false;
                    btnEl.textContent = '🗑️ Hapus';
                }
            }
        }

        function hitungStats(data) {
            const total = data.length;
            const lunas = data.filter(p => p.status === 'lunas').length;
            const pending = data.filter(p => p.status === 'pending' || p.status === 'menunggu').length;
            const gagal = data.filter(p => p.status === 'gagal').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-lunas').textContent = lunas;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-gagal').textContent = gagal;
        }

        function tampilkanToast(pesan, tipe) {
            const toast = document.getElementById('toast');
            toast.textContent = pesan;
            toast.className = 'toast show' + (tipe ? ' ' + tipe : '');
            clearTimeout(tampilkanToast._t);
            tampilkanToast._t = setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // Helper: escape HTML biar data user gak bisa inject script
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Jalankan saat halaman dibuka
        ambilPesanan();
    </script>
</body>
  </html>
