name: Build APK Developer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install

      - name: Siapkan file web developer
        run: node acak.mjs

      - name: Buat proyek Android Developer
        run: |
          cp -r www-dev developer-app/
          cd developer-app
          npm install
          npx cap add android
          npx cap sync android

      - name: Atur nomor versi
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" developer-app/android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.0.0"/' developer-app/android/app/build.gradle

      - name: Bangun APK Developer
        run: |
          cd developer-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: appnesia-developer-apk
          path: developer-app/android/app/build/outputs/apk/debug/app-debug.apk
