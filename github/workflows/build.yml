name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Pasang dependensi
        run: npm install
      - name: Siapkan file web
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Buat proyek Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Pasang App ID AdMob
        run: |
          sed -i 's#</resources>#    <string name="admob_app_id">ca-app-pub-9248735969163203~4437591923</string>\n</resources>#' android/app/src/main/res/values/strings.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: appnesia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
